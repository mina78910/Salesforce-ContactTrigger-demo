<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salesforce 取引先・取引先責任者 デモ画面</title>
  <style>
    :root {
      --salesforce-blue: #1589ee;
      --salesforce-dark-blue: #0b5cab;
      --success-green: #04844b;
      --text: #080707;
      --muted: #706e6b;
      --line: rgba(112, 110, 107, 0.45);
      --card-shadow: 0 14px 30px rgba(22, 50, 92, 0.14), 0 2px 6px rgba(8, 7, 7, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, #ffffff 0, #eef4fb 34%, #dfe8f3 100%);
      overflow: hidden;
    }

    .header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 22px;
      color: #fff;
      background: linear-gradient(135deg, var(--salesforce-dark-blue) 0%, var(--salesforce-blue) 52%, #38a3ff 100%);
      box-shadow: 0 10px 28px rgba(8, 7, 7, 0.18);
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
    }

    .badge {
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      font-size: 11px;
      font-weight: 700;
    }

    .architecture-container {
      position: relative;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 54px);
      overflow: hidden;
    }

    .architecture-container::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: #eef2f6;
      background-image: linear-gradient(rgba(255, 255, 255, 0.58), rgba(255, 255, 255, 0.12)), radial-gradient(#d1dbe8 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .tier {
      position: relative;
      z-index: 1;
      display: flex;
      flex: 1 1 0;
      min-height: 0;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 38px 32px 22px;
      border-bottom: 2px dashed var(--line);
    }

    .tier-label {
      position: absolute;
      top: 12px;
      left: 20px;
      z-index: 2;
      padding: 5px 13px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(216, 221, 230, 0.9);
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(22, 50, 92, 0.12);
      font-size: 14px;
      font-weight: 700;
    }

    .tier-top,
    .tier-middle,
    .tier-bottom {
      flex: 1 1 0;
    }
    .tier-bottom {
      border-bottom: none;
      align-items: center;
    }

    .middle-spacer {
      width: 100%;
      height: 100%;
    }

    .flow-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(760px, 100%);
      height: 100%;
    }

    .source-user {
      position: absolute;
      left: 16px;
      top: 50%;
      display: grid;
      place-items: center;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffffff 0%, #fff7ed 100%);
      border: 1px solid #f4c48a;
      box-shadow: var(--card-shadow);
      color: #8a4b00;
      font-size: 38px;
      transform: translateY(-50%);
    }

    .source-user::after {
      content: '';
      position: absolute;
      right: -12px;
      top: 50%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #2e844a;
      box-shadow: 0 0 0 6px rgba(46, 132, 74, 0.12);
      transform: translateY(-50%);
    }

    .data-loader {
      position: relative;
      display: grid;
      place-items: center;
      width: 220px;
      min-height: 112px;
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff 0%, #f3f7fc 100%);
      border: 1px solid #c9d7e8;
      border-top: 5px solid #6f42c1;
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }

    .data-loader::before {
      content: '';
      position: absolute;
      inset: 12px 22px auto;
      height: 16px;
      border-radius: 999px;
      background: linear-gradient(90deg, #eef4fb, #dbe8f8);
      box-shadow: inset 0 1px 3px rgba(22, 50, 92, 0.14);
    }

    .data-loader::after {
      content: '';
      position: absolute;
      top: 53px;
      left: 50%;
      width: 92px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #2e844a, #45c65a);
      box-shadow: 0 0 0 5px rgba(46, 132, 74, 0.12);
      transform: translateX(-50%);
      animation: loaderSlotPulse 5.6s ease-in-out infinite;
    }

    .data-loader-title {
      position: relative;
      z-index: 1;
      margin-top: 50px;
      color: #16325c;
      font-size: 15px;
      font-weight: 800;
    }

    .csv-file {
      position: absolute;
      left: 112px;
      top: calc(50% - 35px);
      z-index: 3;
      display: grid;
      place-items: center;
      width: 62px;
      height: 70px;
      color: #2e844a;
      border: 2px solid #2e844a;
      border-radius: 8px 14px 8px 8px;
      background: linear-gradient(180deg, #ffffff 0%, #effaf3 100%);
      box-shadow: 0 12px 22px rgba(22, 50, 92, 0.18);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.04em;
      animation: csvToLoader 5.6s cubic-bezier(.45, 0, .2, 1) infinite;
    }

    .csv-file::before {
      content: '';
      position: absolute;
      top: -2px;
      right: -2px;
      border-top: 18px solid #b9e6cc;
      border-left: 18px solid transparent;
      border-radius: 0 12px 0 0;
    }

    .flow-line {
      position: absolute;
      left: 115px;
      right: 165px;
      top: 50%;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(21, 137, 238, 0.35), transparent);
      transform: translateY(-50%);
    }

    @keyframes csvToLoader {
      0%, 8% { opacity: 0; transform: translateX(0) scale(0.82); }
      16% { opacity: 1; transform: translateX(0) scale(1); }
      38% { opacity: 1; transform: translateX(220px) scale(1); }
      48%, 100% { opacity: 0; transform: translateX(290px) scale(0.42); }
    }

    @keyframes loaderSlotPulse {
      0%, 36%, 60%, 100% { box-shadow: 0 0 0 5px rgba(46, 132, 74, 0.12); }
      44% { box-shadow: 0 0 0 12px rgba(46, 132, 74, 0.22); }
    }


    .contact-batch {
      position: absolute;
      left: calc(50% - 56px);
      top: calc(16.666% + 18px);
      z-index: 6;
      display: grid;
      gap: 4px;
      width: 112px;
      opacity: 0;
      pointer-events: none;
      animation: batchToContact 5.6s cubic-bezier(.42, 0, .18, 1) infinite;
    }

    .batch-sheet {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 20px;
      padding: 0 8px;
      border: 1px solid #8bd3a7;
      border-left: 4px solid #2e844a;
      border-radius: 7px;
      background: linear-gradient(180deg, #ffffff 0%, #effaf3 100%);
      box-shadow: 0 5px 10px rgba(22, 50, 92, 0.12);
      color: #1f5f3a;
      font-size: 9px;
      font-weight: 800;
    }

    .batch-sheet:nth-child(2) { transform: translateX(6px); }
    .batch-sheet:nth-child(3) { transform: translateX(12px); }

    .saved-contact-group {
      align-self: center;
      justify-self: center;
      width: min(210px, 74%);
      padding: 12px 14px;
      border: 1px solid #8bd3a7;
      border-left: 6px solid #2e844a;
      border-radius: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #effaf3 100%);
      box-shadow: 0 8px 18px rgba(22, 50, 92, 0.12);
      color: #1f5f3a;
      text-align: center;
      opacity: 0;
      transform: translateY(8px) scale(.96);
      animation: savedGroupAppear 5.6s ease-in-out infinite;
    }

    .saved-contact-group strong {
      display: block;
      font-size: 13px;
      line-height: 1.2;
    }

    .saved-contact-group span {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 800;
    }

    @keyframes batchToContact {
      0%, 52% { opacity: 0; transform: translate(0, 0) scale(.82); }
      58% { opacity: 1; transform: translate(0, 0) scale(1); }
      78% { opacity: 1; transform: translate(31vw, 54vh) scale(1); }
      88%, 100% { opacity: 0; transform: translate(34vw, 58vh) scale(.62); }
    }

    @keyframes savedGroupAppear {
      0%, 78% { opacity: 0; transform: translateY(8px) scale(.96); }
      86%, 96% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(0) scale(1); }
    }


    .objects-wrapper {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(300px, 0.78fr);
      gap: 22px;
      width: min(980px, 100%);
      height: 100%;
      align-items: stretch;
    }

    .object-card {
      position: relative;
      display: flex;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      padding-top: 18px;
      border-radius: 48% / 22px;
      background: linear-gradient(90deg, #f7f9fc 0%, #ffffff 18%, #ffffff 72%, #e8f1fb 100%);
      border: 1px solid #b8c6d9;
      box-shadow: var(--card-shadow);
    }
    .object-card::before,
    .object-card::after {
      content: '';
      position: absolute;
      left: -1px;
      right: -1px;
      height: 38px;
      border: 1px solid #b8c6d9;
      border-radius: 50%;
      pointer-events: none;
    }
    .object-card::before {
      top: -1px;
      z-index: 2;
      background: radial-gradient(ellipse at center, #ffffff 0%, #dcecff 62%, #b9d9fb 100%);
      box-shadow: inset 0 8px 14px rgba(255, 255, 255, 0.72), 0 5px 9px rgba(22, 50, 92, 0.12);
    }
    .object-card::after {
      bottom: -20px;
      z-index: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(11, 92, 171, 0.14));
      box-shadow: inset 0 -7px 12px rgba(22, 50, 92, 0.11);
    }
    .object-card.contacts::before {
      background: radial-gradient(ellipse at center, #ffffff 0%, #dff4e8 62%, #b9e6cc 100%);
    }

    .object-header {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 16px;
      padding: 7px 12px;
      color: #fff;
      border-radius: 999px;
      background: linear-gradient(135deg, #16325c 0%, var(--salesforce-blue) 100%);
      box-shadow: 0 8px 14px rgba(22, 50, 92, 0.16);
    }
    .object-card.contacts .object-header {
      background: linear-gradient(135deg, #2e844a 0%, var(--success-green) 100%);
    }

    .object-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
    }
    .record-count {
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      font-size: 12px;
      font-weight: 800;
    }

    .records {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: repeat(10, minmax(0, 1fr));
      gap: 3px;
      padding: 7px 10px;
      overflow: hidden;
    }

    .record {
      padding: 2px 9px;
      border: 1px solid #d8dde6;
      border-left: 4px solid var(--salesforce-blue);
      border-radius: 8px;
      background: linear-gradient(180deg, #fff 0%, #f7f9fc 100%);
      box-shadow: 0 2px 7px rgba(22, 50, 92, 0.07);
      font-size: 11px;
    }
    .record strong {
      display: block;
      color: #16325c;
      font-size: 11px;
      line-height: 1.08;
    }
    .record span { color: var(--muted); }

    .object-body {
      position: relative;
      z-index: 1;
      flex: 1;
      margin: 0 16px 16px;
      padding-top: 6px;
      background: linear-gradient(90deg, rgba(255,255,255,0.24), rgba(255,255,255,0.68) 45%, rgba(11,92,171,0.07));
    }
    .contacts .object-body {
      background: linear-gradient(90deg, rgba(255,255,255,0.24), rgba(255,255,255,0.68) 45%, rgba(4,132,75,0.07));
    }
    .contacts-body {
      display: grid;
      place-items: center;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-title">☁️ Salesforce オブジェクト状態図</div>
    <div class="badge">初期状態</div>
  </header>

  <main class="architecture-container" aria-label="Salesforceデモの3階層画面">
    <div class="contact-batch" aria-hidden="true">
      <div class="batch-sheet"><span>Contact</span><span>×5</span></div>
      <div class="batch-sheet"><span>Contact</span><span>×5</span></div>
      <div class="batch-sheet"><span>Contact</span><span>×5</span></div>
    </div>
    <section class="tier tier-top" aria-labelledby="top-label">
      <div id="top-label" class="tier-label">上段：CSV投入</div>
      <div class="flow-stage" aria-label="ユーザーがCSVをデータローダーに投入するアニメーション">
        <div class="source-user" aria-hidden="true">🧑‍💼</div>
        <div class="flow-line" aria-hidden="true"></div>
        <div class="csv-file" aria-hidden="true">CSV</div>
        <article class="data-loader" aria-label="データローダー">
          <div class="data-loader-title">Data Loader</div>
        </article>
      </div>
    </section>

    <section class="tier tier-middle" aria-labelledby="middle-label">
      <div id="middle-label" class="tier-label">中段：処理エリア</div>
      <div class="middle-spacer" aria-hidden="true"></div>
    </section>

    <section class="tier tier-bottom" aria-labelledby="bottom-label">
      <div id="bottom-label" class="tier-label">下段：Salesforceオブジェクト</div>
      <div class="objects-wrapper">
        <article class="object-card accounts" aria-label="取引先オブジェクト">
          <header class="object-header">
            <div class="object-name">🏢 取引先オブジェクト</div>
            <div class="record-count">10 records</div>
          </header>
          <div class="object-body records">
            <div class="record"><strong>Acme株式会社</strong></div>
            <div class="record"><strong>グローバル商事</strong></div>
            <div class="record"><strong>東京テック</strong></div>
            <div class="record"><strong>北斗システム</strong></div>
            <div class="record"><strong>サクラ食品</strong></div>
            <div class="record"><strong>Blue Ocean合同会社</strong></div>
            <div class="record"><strong>Future Works</strong></div>
            <div class="record"><strong>山吹物流</strong></div>
            <div class="record"><strong>Cloud Nine</strong></div>
            <div class="record"><strong>南風デザイン</strong></div>
          </div>
        </article>

        <article class="object-card contacts" aria-label="取引先責任者オブジェクト">
          <header class="object-header">
            <div class="object-name">👤 取引先責任者オブジェクト</div>
            <div class="record-count">15 records</div>
          </header>
          <div class="object-body contacts-body" aria-hidden="true">
            <div class="saved-contact-group"><strong>取引先責任者</strong><span>15 records</span></div>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
